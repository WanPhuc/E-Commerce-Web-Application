services:
  db:
    image: postgres:17-alpine
    container_name: shoppy-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-WebBanHang}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-WebBanHang}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../web_banhang_be
      dockerfile: DockerFile
    container_name: shoppy-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../web_banhang_be/.env
    environment:
      ConnectionStrings__PostgresConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-WebBanHang};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
    ports:
      - "${API_PORT:-7100}:8080"

  fe:
    image: node:22-alpine
    container_name: shoppy-fe
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - api
    environment:
      CHOKIDAR_USEPOLLING: "true"
      NODE_ENV: development
    command: sh -c "npm install && npm start -- --host 0.0.0.0 --port 4200"
    volumes:
      - ../web_banhang_fe:/app
      - fe_node_modules:/app/node_modules
    ports:
      - "${FE_PORT:-4200}:4200"

volumes:
  postgres_data:
  fe_node_modules:
