services:
  api:
    build:
      context: ../web_banhang_be
      dockerfile: DockerFile
    container_name: shoppy-api-prod
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      UseHttpsRedirection: ${USE_HTTPS_REDIRECTION:-false}
      ConnectionStrings__PostgresConnection: ${POSTGRES_CONNECTION_STRING}
      AllowedOrigins: ${ALLOWED_ORIGINS}
      JwtSettings__SecretKey: ${JWT_SECRET_KEY}
      JwtSettings__Issuer: ${JWT_ISSUER:-http://localhost}
      JwtSettings__Audience: ${JWT_AUDIENCE:-http://localhost}
      Supabase__Url: ${SUPABASE_URL}
      Supabase__ServiceRoleKey: ${SUPABASE_SERVICE_ROLE_KEY}
      Supabase__StorageBucket: ${SUPABASE_STORAGE_BUCKET:-product-images}
      DemoSeed__Enabled: ${DEMO_SEED_ENABLED:-false}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET}

  fe:
    build:
      context: ../web_banhang_fe
      dockerfile: Dockerfile
    container_name: shoppy-fe-prod
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FE_PORT:-80}:80"
